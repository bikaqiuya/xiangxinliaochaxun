<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香辛料与药食同源品种目录</title>
<meta name="description" content="香辛料及卫健委公告明确作为香辛料和调味品使用的药食同源品种目录">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --line: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #7c3aed;
    --spice: #8b5cf6;
    --medicinal: #10b981;
    --warn: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, #7c3aed 0%, #10b981 100%);
    color: white;
    padding: 32px 20px 28px;
    text-align: center;
  }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header p { opacity: .85; font-size: 14px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* 搜索栏 */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-bar input, .search-bar select {
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    background: var(--card);
    flex: 1;
    min-width: 160px;
  }
  .search-bar input { max-width: 320px; }

  /* 统计 */
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat-chip strong { color: var(--text); font-size: 18px; margin-right: 4px; }

  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
  }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    color: white;
    white-space: nowrap;
  }
  .badge.spice { background: var(--spice); }
  .badge.medicinal { background: var(--medicinal); }

  .card-body { font-size: 13px; }
  .field { margin-bottom: 6px; }
  .field-label { color: var(--muted); font-size: 12px; }
  .field-value { color: var(--text); }

  .med-info {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
  }
  .med-info .field-label { color: var(--medicinal); }

  .safety {
    margin-top: 8px;
    padding: 6px 10px;
    background: #fef3c7;
    border-radius: 6px;
    color: #92400e;
    font-size: 12px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    margin-top: 40px;
  }

  /* 加载 */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    header h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌿 香辛料与药食同源品种目录</h1>
  <p>卫健委公告明确作为香辛料和调味品使用的品种 · 数据仅供参考，以官方最新公告为准</p>
</header>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜索名称、拉丁名、别名...">
    <select id="catFilter">
      <option value="">全部分类</option>
      <option value="spice">香辛料</option>
      <option value="medicinal">药食同源（香辛料/调味品类）</option>
    </select>
  </div>

  <div class="stats" id="stats"></div>

  <div id="content">
    <div class="loading">加载中...</div>
  </div>
</div>

<footer>
  <p>数据来源：GB/T 12729、GB/T 21725 及国家卫健委公告 · 仅作参考，不构成任何医疗或食用建议</p>
</footer>

<script>
const API = '/api';

let ALL_DATA = [];

async function fetchData() {
  try {
    const res = await fetch(API + '/spices');
    if (!res.ok) throw new Error('数据加载失败');
    ALL_DATA = await res.json();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="empty">数据加载失败：${e.message}<br><button onclick="fetchData()" style="margin-top:12px;padding:8px 16px;border:1px solid #e2e8f0;border-radius:8px;background:white;cursor:pointer;">重试</button></div>`;
  }
}

function getCatLabel(cat) {
  return cat === 'medicinal' ? '药食同源' : '香辛料';
}
function getCatClass(cat) {
  return cat === 'medicinal' ? 'medicinal' : 'spice';
}

function render() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = document.getElementById('catFilter').value;

  let filtered = ALL_DATA.filter(item => {
    if (cat && item.category !== cat) return false;
    if (kw) {
      const haystack = [
        item.name,
        item.botanical,
        item.part,
        item.note,
        item.medicinal?.alias || ''
      ].join(' ').toLowerCase();
      if (!haystack.includes(kw)) return false;
    }
    return true;
  });

  // 统计
  const spiceCount = ALL_DATA.filter(x => x.category === 'spice').length;
  const medCount = ALL_DATA.filter(x => x.category === 'medicinal').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-chip"><strong>${ALL_DATA.length}</strong> 总计</div>
    <div class="stat-chip"><strong>${spiceCount}</strong> 香辛料</div>
    <div class="stat-chip"><strong>${medCount}</strong> 药食同源（香辛料/调味品类）</div>
    <div class="stat-chip"><strong>${filtered.length}</strong> 当前显示</div>
  `;

  // 渲染卡片
  const container = document.getElementById('content');
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty">没有匹配的数据</div>`;
    return;
  }

  container.innerHTML = `<div class="grid">
    ${filtered.map(item => {
      const m = item.medicinal || {};
      const isMed = item.category === 'medicinal';

      let stdHtml = '';
      if (!isMed) {
        const stdParts = [item.std12729, item.std21725].filter(Boolean);
        if (stdParts.length) {
          stdHtml = stdParts.map(s => `<span style="background:#f1f5f9;padding:1px 6px;border-radius:4px;font-size:11px;">${s}</span>`).join(' ');
        }
      }

      return `<div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">${item.name}</div>
            ${item.botanical ? `<div class="card-sub"><em>${item.botanical}</em></div>` : ''}
            ${m.alias ? `<div class="card-sub">别名：${m.alias}</div>` : ''}
          </div>
          <span class="badge ${getCatClass(item.category)}">${getCatLabel(item.category)}</span>
        </div>
        <div class="card-body">
          ${item.part ? `<div class="field"><span class="field-label">使用部位：</span><span class="field-value">${item.part}</span></div>` : ''}
          ${!isMed && stdHtml ? `<div class="field"><span class="field-label">标准：</span> ${stdHtml}</div>` : ''}
          ${item.note ? `<div class="field"><span class="field-label">备注：</span><span class="field-value">${item.note}</span></div>` : ''}

          ${isMed ? `<div class="med-info">
            <div class="field"><span class="field-label">📋 公告依据：</span><span class="field-value">${m.announcement || '-'}</span></div>
            ${m.announcementNo ? `<div class="field"><span class="field-label">公告文号：</span><span class="field-value">${m.announcementNo}</span></div>` : ''}
            ${m.announceDate ? `<div class="field"><span class="field-label">发布日期：</span><span class="field-value">${m.announceDate}</span></div>` : ''}
            ${m.usageLimit ? `<div class="field"><span class="field-label">使用限制：</span><span class="field-value">${m.usageLimit}</span></div>` : ''}
          </div>` : ''}

          ${m.safetyNote ? `<div class="safety">⚠️ ${m.safetyNote}</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// 事件
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('catFilter').addEventListener('change', render);

// 启动
fetchData();
</script>

</body>
</html>
